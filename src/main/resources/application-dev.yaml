# application-dev.yml (Development Profile)
spring:
  jpa:
    hibernate:
      ddl-auto: update       # keep data between restarts
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.sujan: DEBUG        # your package for detailed dev logs